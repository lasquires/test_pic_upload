<!doctype html><meta charset="utf-8"><title>Georgia DDS High-Yield Permit Quiz</title><body><p style="font-family:system-ui;padding:20px">Loading quiz…</p><script>(async()=>{let s='';for(let i=1;i<=7;i++)s+=await (await fetch('c'+i+'.txt')).text();const u=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()})().catch(e=>document.body.innerHTML='<pre>Unable to load quiz: '+e+'</pre>')</script></body>
